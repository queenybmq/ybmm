<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫雷 - Minesweeper</title>
  <style>
    :root {
      --bg: #f0ebe3;
      --block-base: #e8e4dc;
      --block-highlight: #ffffff;
      --block-shadow: #c4c0b8;
      --block-dark: #b8b4ac;
      --text-muted: #9a9690;
      --text-primary: #4a4a4a;
      --color-1: #5c8bc9;
      --color-2: #6ba572;
      --color-3: #d66b6b;
      --color-4: #8b6bb9;
      --color-5: #c9966b;
      --color-6: #6bb5b5;
      --color-7: #4a4a4a;
      --color-8: #888888;
      --mine: #2d2d2d;
      --flag: #d66b6b;
      --cell-size: 36px;
      --gold: #d4af37;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, #e5e1d9 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      user-select: none;
      -webkit-user-select: none;
    }

    .game-wrapper {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .game-header {
      text-align: center;
      padding: 8px 0;
    }

    .game-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      letter-spacing: 2px;
    }

    .game-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .mode-selector {
      display: flex;
      gap: 8px;
      background: var(--block-shadow);
      padding: 6px;
      border-radius: 12px;
      box-shadow: 
        inset 2px 2px 4px var(--block-dark),
        inset -2px -2px 4px var(--block-highlight);
    }

    .mode-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .mode-btn:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .mode-btn.active {
      background: var(--block-highlight);
      color: var(--color-3);
      box-shadow: 
        2px 2px 4px var(--block-shadow),
        -1px -1px 3px var(--block-highlight);
    }

    .mode-icon {
      font-size: 16px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--block-base);
      border-radius: 12px;
      box-shadow: 
        4px 4px 8px var(--block-shadow),
        -2px -2px 6px var(--block-highlight);
    }

    .stat-box {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--block-shadow);
      border-radius: 6px;
      box-shadow: 
        inset 2px 2px 3px var(--block-dark),
        inset -1px -1px 2px var(--block-highlight);
    }

    .stat-icon {
      font-size: 16px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-3);
      min-width: 32px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .face-btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 10px;
      background: var(--block-base);
      box-shadow: 
        3px 3px 6px var(--block-shadow),
        -2px -2px 4px var(--block-highlight);
      cursor: pointer;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }

    .face-btn:active {
      box-shadow: 
        1px 1px 3px var(--block-shadow),
        inset 2px 2px 4px var(--block-shadow),
        inset -2px -2px 4px var(--block-highlight);
      transform: translate(1px, 1px);
    }

    .score-display {
      display: flex;
      gap: 12px;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 14px;
      background: var(--block-shadow);
      border-radius: 6px;
      box-shadow: 
        inset 2px 2px 3px var(--block-dark),
        inset -1px -1px 2px var(--block-highlight);
    }

    .score-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .score-value {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    #score {
      color: var(--color-1);
    }

    #combo {
      color: var(--color-3);
    }

    .combo-value.active {
      animation: comboPop 0.3s ease;
    }

    @keyframes comboPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }

    .grid-container {
      background: var(--block-shadow);
      padding: 8px;
      border-radius: 12px;
      box-shadow: 
        6px 6px 12px var(--block-dark),
        -3px -3px 8px var(--block-highlight);
    }

    .grid {
      display: grid;
      gap: 2px;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      border: none;
      border-radius: 4px;
      background: linear-gradient(145deg, var(--block-highlight), var(--block-base));
      box-shadow: 
        2px 2px 4px var(--block-shadow),
        -1px -1px 2px var(--block-highlight);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      transition: all 0.08s ease;
    }

    .cell:hover:not(.revealed):not(.game-over) {
      background: linear-gradient(145deg, #f5f5f5, var(--block-base));
    }

    .cell:active:not(.revealed):not(.game-over) {
      background: var(--block-shadow);
      box-shadow: 
        inset 1px 1px 2px var(--block-dark),
        inset -1px -1px 2px var(--block-highlight);
    }

    .cell.revealed {
      background: var(--block-shadow);
      box-shadow: 
        inset 2px 2px 4px var(--block-dark),
        inset -1px -1px 2px var(--block-highlight);
      cursor: default;
    }

    .cell.flagged::after {
      content: '🚩';
      font-size: 16px;
    }

    .cell.mine::after {
      content: '';
      width: 16px;
      height: 16px;
      background: var(--mine);
      border-radius: 50%;
      box-shadow: 0 0 3px var(--mine);
    }

    .cell.mine-hit::after {
      background: var(--color-3);
    }

    .cell[data-num="1"] { color: var(--color-1); }
    .cell[data-num="2"] { color: var(--color-2); }
    .cell[data-num="3"] { color: var(--color-3); }
    .cell[data-num="4"] { color: var(--color-4); }
    .cell[data-num="5"] { color: var(--color-5); }
    .cell[data-num="6"] { color: var(--color-6); }
    .cell[data-num="7"] { color: var(--color-7); }
    .cell[data-num="8"] { color: var(--color-8); }

    .cell.game-over {
      opacity: 0.85;
    }

    .difficulty-selector {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: var(--block-shadow);
      border-radius: 10px;
      box-shadow: 
        inset 2px 2px 4px var(--block-dark),
        inset -2px -2px 4px var(--block-highlight);
    }

    .diff-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .diff-btn:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .diff-btn.active {
      background: var(--block-highlight);
      color: var(--color-3);
      box-shadow: 
        2px 2px 4px var(--block-shadow),
        -1px -1px 3px var(--block-highlight);
    }

    .diff-icon {
      font-size: 14px;
    }

    .settings-section {
      background: var(--block-base);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 
        3px 3px 6px var(--block-shadow),
        -2px -2px 4px var(--block-highlight);
    }

    .settings-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 14px 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .settings-toggle:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .settings-toggle-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-arrow {
      font-size: 10px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    .settings-toggle.active .toggle-arrow {
      transform: rotate(180deg);
    }

    .settings-panel {
      padding: 0 16px 16px;
      display: none;
    }

    .settings-panel.show {
      display: block;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--block-shadow);
      border-radius: 8px;
      gap: 12px;
    }

    .setting-info {
      flex: 1;
    }

    .setting-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      display: block;
      margin-bottom: 2px;
    }

    .setting-desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: var(--block-dark);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .toggle-switch.active {
      background: var(--color-3);
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: var(--block-highlight);
      border-radius: 50%;
      box-shadow: 0 2px 3px var(--block-dark);
      transition: transform 0.2s ease;
    }

    .toggle-switch.active::after {
      transform: translateX(20px);
    }

    .leaderboard-section {
      background: var(--block-base);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 
        3px 3px 6px var(--block-shadow),
        -2px -2px 4px var(--block-highlight);
    }

    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .leaderboard-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .leaderboard-tabs {
      display: flex;
      gap: 4px;
      background: var(--block-shadow);
      padding: 4px;
      border-radius: 8px;
    }

    .leaderboard-tab {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .leaderboard-tab.active {
      background: var(--block-highlight);
      color: var(--color-3);
      box-shadow: 0 1px 3px var(--block-dark);
    }

    .leaderboard {
      background: var(--block-shadow);
      border-radius: 8px;
      padding: 6px;
    }

    .leaderboard-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--block-highlight);
      border-radius: 6px;
    }

    .leaderboard-rank {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .leaderboard-rank.gold { color: var(--gold); }
    .leaderboard-rank.silver { color: var(--silver); }
    .leaderboard-rank.bronze { color: var(--bronze); }

    .leaderboard-name {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .leaderboard-time {
      font-size: 13px;
      font-weight: 700;
      color: var(--color-3);
      font-variant-numeric: tabular-nums;
    }

    .leaderboard-empty {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .game-footer {
      text-align: center;
      padding: 8px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(3px);
      z-index: 999;
    }

    .new-record-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--block-highlight);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      min-width: 280px;
      text-align: center;
    }

    .modal-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .modal-icon {
      font-size: 48px;
    }

    .new-record-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .new-record-score {
      margin-bottom: 20px;
    }

    .score-number {
      font-size: 40px;
      font-weight: 800;
      color: var(--color-3);
      font-variant-numeric: tabular-nums;
    }

    .new-record-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--block-shadow);
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
      background: var(--bg);
    }

    .new-record-input:focus {
      border-color: var(--color-3);
    }

    .new-record-buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .new-record-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .new-record-btn.submit {
      background: var(--color-3);
      color: white;
    }

    .new-record-btn.submit:hover {
      background: #c55555;
      transform: translateY(-2px);
    }

    .new-record-btn.cancel {
      background: var(--block-shadow);
      color: var(--text-primary);
    }

    .new-record-btn.cancel:hover {
      background: var(--block-dark);
    }

    @keyframes winShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .grid.win {
      animation: winShake 0.5s ease;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }

      :root {
        --cell-size: 30px;
      }

      .game-title {
        font-size: 24px;
      }

      .header-bar {
        padding: 10px 12px;
      }

      .stat-box {
        padding: 4px 10px;
      }

      .stat-icon {
        font-size: 14px;
      }

      .stat-value {
        font-size: 16px;
      }

      .face-btn {
        width: 42px;
        height: 42px;
        font-size: 20px;
      }

      .score-box {
        padding: 4px 10px;
      }

      .score-value {
        font-size: 16px;
      }

      .mode-btn,
      .diff-btn {
        padding: 8px 10px;
        font-size: 12px;
      }

      .leaderboard-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 380px) {
      :root {
        --cell-size: 26px;
      }

      .score-display {
        gap: 8px;
      }

      .score-box {
        padding: 4px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <header class="game-header">
      <h1 class="game-title">💣 扫雷</h1>
      <p class="game-subtitle">经典与创新的完美结合</p>
    </header>

    <div class="mode-selector">
      <button class="mode-btn active" data-mode="classic">
        <span class="mode-icon">🎯</span>
        <span>经典模式</span>
      </button>
      <button class="mode-btn" data-mode="score">
        <span class="mode-icon">🏆</span>
        <span>得分模式</span>
      </button>
    </div>

    <div class="header-bar">
      <div class="stat-box">
        <span class="stat-icon">💣</span>
        <span class="stat-value" id="mines-count">010</span>
      </div>
      <button class="face-btn" id="face-btn">😊</button>
      <div class="stat-box">
        <span class="stat-icon">⏱</span>
        <span class="stat-value" id="timer">000</span>
      </div>
    </div>

    <div class="score-display" id="score-display" style="display: none;">
      <div class="score-box">
        <span class="score-label">得分</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">连击</span>
        <span class="score-value" id="combo">0</span>
      </div>
    </div>

    <div class="grid-container">
      <div class="grid" id="grid"></div>
    </div>

    <div class="difficulty-selector">
      <button class="diff-btn active" data-level="beginner">
        <span class="diff-icon">🌱</span>
        <span>初级</span>
      </button>
      <button class="diff-btn" data-level="intermediate">
        <span class="diff-icon">🌿</span>
        <span>中级</span>
      </button>
      <button class="diff-btn" data-level="expert">
        <span class="diff-icon">🌳</span>
        <span>高级</span>
      </button>
    </div>

    <div class="settings-section">
      <button class="settings-toggle" id="settings-toggle">
        <div class="settings-toggle-left">
          <span>⚙️</span>
          <span>设置</span>
        </div>
        <span class="toggle-arrow">▼</span>
      </button>
      <div class="settings-panel" id="settings-panel">
        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-label">插旗自动翻开</span>
            <span class="setting-desc">当周围旗帜数等于数字时，自动翻开未标记的格子</span>
          </div>
          <div class="toggle-switch active" id="auto-reveal-toggle"></div>
        </div>
      </div>
    </div>

    <div class="leaderboard-section">
      <div class="leaderboard-header">
        <div class="leaderboard-title">
          <span>🏆</span>
          <span>排行榜</span>
        </div>
        <div class="leaderboard-tabs">
          <button class="leaderboard-tab active" data-tab="beginner">初级</button>
          <button class="leaderboard-tab" data-tab="intermediate">中级</button>
          <button class="leaderboard-tab" data-tab="expert">高级</button>
        </div>
      </div>
      <div class="leaderboard">
        <ul class="leaderboard-list" id="leaderboard-list"></ul>
      </div>
    </div>

    <footer class="game-footer">
      <p>🎮 点击笑脸重新开始 · 右键插旗</p>
    </footer>
  </div>

  <div id="modal-overlay" class="modal-overlay" style="display: none;"></div>
  <div id="new-record-modal" class="new-record-modal" style="display: none;">
    <div class="modal-header">
      <span class="modal-icon">🎉</span>
      <h3 class="new-record-title">新纪录！</h3>
    </div>
    <div class="new-record-score">
      <span class="score-number" id="new-record-time">0</span>
    </div>
    <input type="text" class="new-record-input" id="player-name" placeholder="输入你的名字" maxlength="10">
    <div class="new-record-buttons">
      <button class="new-record-btn cancel" id="cancel-btn">取消</button>
      <button class="new-record-btn submit" id="submit-btn">保存</button>
    </div>
  </div>

  <script>
    const DIFFICULTIES = {
      beginner: { rows: 9, cols: 9, mines: 10, name: '初级' },
      intermediate: { rows: 16, cols: 16, mines: 40, name: '中级' },
      expert: { rows: 16, cols: 30, mines: 99, name: '高级' }
    };

    const FACES = {
      normal: '😊',
      playing: '😮',
      win: '😎',
      lose: '😵'
    };

    let grid = [];
    let rows, cols, totalMines;
    let gameState = 'idle';
    let firstClick = true;
    let flagCount = 0;
    let revealedCount = 0;
    let timer = 0;
    let timerInterval = null;
    let currentLevel = 'beginner';
    let currentMode = 'classic';
    let leaderboards = {};
    let autoRevealOnFlag = true;

    let score = 0;
    let combo = 0;
    let comboTimer = null;
    let gameTimerInterval = null;
    let scoreLeaderboards = {};

    const gridEl = document.getElementById('grid');
    const minesCountEl = document.getElementById('mines-count');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('face-btn');
    const diffBtns = document.querySelectorAll('.diff-btn');
    const leaderboardTabs = document.querySelectorAll('.leaderboard-tab');
    const leaderboardListEl = document.getElementById('leaderboard-list');
    const newRecordModal = document.getElementById('new-record-modal');
    const modalOverlay = document.getElementById('modal-overlay');
    const newRecordTimeEl = document.getElementById('new-record-time');
    const playerNameInput = document.getElementById('player-name');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const autoRevealToggle = document.getElementById('auto-reveal-toggle');
    const modeBtns = document.querySelectorAll('.mode-btn');
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const scoreDisplayEl = document.getElementById('score-display');
    const settingsToggle = document.getElementById('settings-toggle');
    const settingsPanel = document.getElementById('settings-panel');

    function loadSettings() {
      const saved = localStorage.getItem('minesweeper_settings');
      if (saved) {
        const settings = JSON.parse(saved);
        autoRevealOnFlag = settings.autoRevealOnFlag !== undefined ? settings.autoRevealOnFlag : true;
      }
      updateAutoRevealToggle();
    }

    function saveSettings() {
      localStorage.setItem('minesweeper_settings', JSON.stringify({
        autoRevealOnFlag
      }));
    }

    function updateAutoRevealToggle() {
      if (autoRevealToggle) {
        autoRevealToggle.classList.toggle('active', autoRevealOnFlag);
      }
    }

    function initLeaderboards() {
      const saved = localStorage.getItem('minesweeper_leaderboards');
      if (saved) {
        leaderboards = JSON.parse(saved);
      } else {
        leaderboards = {
          beginner: [
            { name: '玩家', time: 45 },
            { name: '高手', time: 58 },
            { name: '大师', time: 72 },
            { name: '新手', time: 90 },
            { name: '小白', time: 120 }
          ],
          intermediate: [
            { name: '高手', time: 120 },
            { name: '大师', time: 150 },
            { name: '玩家', time: 180 }
          ],
          expert: [
            { name: '大师', time: 240 },
            { name: '高手', time: 300 }
          ]
        };
      }

      const savedScore = localStorage.getItem('minesweeper_score_leaderboards');
      if (savedScore) {
        scoreLeaderboards = JSON.parse(savedScore);
      } else {
        scoreLeaderboards = {
          beginner: [
            { name: '得分王', score: 5000 },
            { name: '高分玩家', score: 3500 },
            { name: '新手', score: 2000 }
          ],
          intermediate: [
            { name: '得分王', score: 8000 },
            { name: '高分玩家', score: 6000 }
          ],
          expert: [
            { name: '得分王', score: 12000 }
          ]
        };
      }
      renderLeaderboard('beginner');
    }

    function saveLeaderboards() {
      localStorage.setItem('minesweeper_leaderboards', JSON.stringify(leaderboards));
    }

    function saveScoreLeaderboards() {
      localStorage.setItem('minesweeper_score_leaderboards', JSON.stringify(scoreLeaderboards));
    }

    function renderLeaderboard(level) {
      const records = currentMode === 'classic' ? (leaderboards[level] || []) : (scoreLeaderboards[level] || []);
      leaderboardListEl.innerHTML = '';
      
      if (records.length === 0) {
        leaderboardListEl.innerHTML = '<li class="leaderboard-empty">暂无记录</li>';
        return;
      }
      
      const sortedRecords = currentMode === 'classic' 
        ? [...records].sort((a, b) => a.time - b.time)
        : [...records].sort((a, b) => b.score - a.score);
      
      sortedRecords.slice(0, 10).forEach((record, index) => {
        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        
        const rankSpan = document.createElement('span');
        rankSpan.className = 'leaderboard-rank';
        if (index === 0) rankSpan.classList.add('gold');
        else if (index === 1) rankSpan.classList.add('silver');
        else if (index === 2) rankSpan.classList.add('bronze');
        rankSpan.textContent = index + 1;
        
        const nameSpan = document.createElement('span');
        nameSpan.className = 'leaderboard-name';
        nameSpan.textContent = record.name;
        
        const valueSpan = document.createElement('span');
        valueSpan.className = 'leaderboard-time';
        if (currentMode === 'classic') {
          valueSpan.textContent = formatTime(record.time);
        } else {
          valueSpan.textContent = record.score;
        }
        
        li.appendChild(rankSpan);
        li.appendChild(nameSpan);
        li.appendChild(valueSpan);
        leaderboardListEl.appendChild(li);
      });
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function checkNewRecord(level, timeOrScore) {
      if (currentMode === 'classic') {
        const records = leaderboards[level] || [];
        if (records.length < 10) return true;
        const worstTime = Math.max(...records.map(r => r.time));
        return timeOrScore < worstTime;
      } else {
        const records = scoreLeaderboards[level] || [];
        if (records.length < 10) return true;
        const worstScore = Math.min(...records.map(r => r.score));
        return timeOrScore > worstScore;
      }
    }

    function addRecord(level, name, timeOrScore) {
      if (currentMode === 'classic') {
        if (!leaderboards[level]) {
          leaderboards[level] = [];
        }
        leaderboards[level].push({ name, time: timeOrScore });
        leaderboards[level].sort((a, b) => a.time - b.time);
        leaderboards[level] = leaderboards[level].slice(0, 10);
        saveLeaderboards();
      } else {
        if (!scoreLeaderboards[level]) {
          scoreLeaderboards[level] = [];
        }
        scoreLeaderboards[level].push({ name, score: timeOrScore });
        scoreLeaderboards[level].sort((a, b) => b.score - a.score);
        scoreLeaderboards[level] = scoreLeaderboards[level].slice(0, 10);
        saveScoreLeaderboards();
      }
      renderLeaderboard(level);
    }

    function showNewRecordModal(timeOrScore) {
      if (currentMode === 'classic') {
        newRecordTimeEl.textContent = formatTime(timeOrScore);
      } else {
        newRecordTimeEl.textContent = timeOrScore;
      }
      playerNameInput.value = '';
      modalOverlay.style.display = 'block';
      newRecordModal.style.display = 'block';
      playerNameInput.focus();
    }

    function hideNewRecordModal() {
      modalOverlay.style.display = 'none';
      newRecordModal.style.display = 'none';
    }

    function switchMode(mode) {
      currentMode = mode;
      modeBtns.forEach(btn => btn.classList.remove('active'));
      modeBtns.forEach(btn => {
        if (btn.dataset.mode === mode) btn.classList.add('active');
      });
      
      if (mode === 'classic') {
        document.querySelector('.header-bar').style.display = 'flex';
        scoreDisplayEl.style.display = 'none';
      } else {
        document.querySelector('.header-bar').style.display = 'none';
        scoreDisplayEl.style.display = 'flex';
      }
      
      renderLeaderboard(currentLevel);
      initGame(currentLevel);
    }

    function initScoreMode() {
      score = 0;
      combo = 0;
      flagCount = 0;
      scoreEl.textContent = score;
      comboEl.textContent = combo;
      minesCountEl.textContent = String(totalMines).padStart(3, '0');
      faceBtn.textContent = FACES.playing;
      
      clearInterval(gameTimerInterval);
      gameTimerInterval = null;
      
      clearTimeout(comboTimer);
      comboTimer = null;
    }

    function updateCombo() {
      combo++;
      comboEl.textContent = combo;
      comboEl.classList.remove('active');
      void comboEl.offsetWidth;
      comboEl.classList.add('active');
      
      clearTimeout(comboTimer);
      comboTimer = setTimeout(() => {
        combo = 0;
        comboEl.textContent = combo;
      }, 2000);
    }

    function calculateScore(baseScore) {
      const comboMultiplier = 1 + Math.min(combo, 20) * 0.1;
      return Math.floor(baseScore * comboMultiplier);
    }

    function endScoreMode(won) {
      gameState = 'over';
      clearInterval(gameTimerInterval);
      clearTimeout(comboTimer);
      gameTimerInterval = null;
      comboTimer = null;
      
      faceBtn.textContent = won ? FACES.win : FACES.lose;
      
      if (!won) {
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const data = grid[r][c];
            if (data.isMine && !data.isRevealed) {
              data.isRevealed = true;
            }
          }
        }
      }
      
      if (checkNewRecord(currentLevel, score)) {
        setTimeout(() => showNewRecordModal(score), 500);
      }
      
      renderAllCells();
    }

    function initGame(level = 'beginner') {
      currentLevel = level;
      const config = DIFFICULTIES[level];
      rows = config.rows;
      cols = config.cols;
      totalMines = config.mines;
      
      grid = [];
      flagCount = 0;
      revealedCount = 0;
      firstClick = true;
      gameState = 'playing';
      timer = 0;
      
      clearInterval(timerInterval);
      timerInterval = null;
      
      if (currentMode === 'score') {
        initScoreMode();
      } else {
        minesCountEl.textContent = String(totalMines).padStart(3, '0');
        timerEl.textContent = '000';
        faceBtn.textContent = FACES.playing;
      }
      
      for (let r = 0; r < rows; r++) {
        grid[r] = [];
        for (let c = 0; c < cols; c++) {
          grid[r][c] = {
            isMine: false,
            isRevealed: false,
            isFlagged: false,
            adjacentMines: 0
          };
        }
      }
      
      renderGrid();
    }

    function generateMines(safeRow, safeCol) {
      const safeZone = new Set();
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = safeRow + dr;
          const nc = safeCol + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
            safeZone.add(`${nr},${nc}`);
          }
        }
      }
      
      let placed = 0;
      while (placed < totalMines) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        if (!grid[r][c].isMine && !safeZone.has(`${r},${c}`)) {
          grid[r][c].isMine = true;
          placed++;
        }
      }
      
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!grid[r][c].isMine) {
            grid[r][c].adjacentMines = countAdjacentMines(r, c);
          }
        }
      }
    }

    function countAdjacentMines(row, col) {
      let count = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = row + dr;
          const nc = col + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
            if (grid[nr][nc].isMine) count++;
          }
        }
      }
      return count;
    }

    function renderGrid() {
      gridEl.innerHTML = '';
      gridEl.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;
      
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement('button');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;
          updateCellDisplay(cell, r, c);
          
          cell.addEventListener('click', handleLeftClick);
          cell.addEventListener('contextmenu', handleRightClick);
          cell.addEventListener('touchstart', handleTouchStart, { passive: false });
          cell.addEventListener('touchend', handleTouchEnd);
          
          gridEl.appendChild(cell);
        }
      }
    }

    function updateCellDisplay(cell, row, col) {
      const data = grid[row][col];
      cell.className = 'cell';
      cell.textContent = '';
      cell.removeAttribute('data-num');
      
      if (data.isRevealed) {
        cell.classList.add('revealed');
        if (data.isMine) {
          cell.classList.add('mine');
          if (data.hit) {
            cell.classList.add('mine-hit');
          }
        } else if (data.adjacentMines > 0) {
          cell.textContent = data.adjacentMines;
          cell.dataset.num = data.adjacentMines;
        }
      } else if (data.isFlagged) {
        cell.classList.add('flagged');
      }
      
      if (gameState === 'over') {
        cell.classList.add('game-over');
      }
    }

    function getCellElement(row, col) {
      return gridEl.querySelector(`[data-row="${row}"][data-col="${col}"]`);
    }

    function handleLeftClick(e) {
      if (gameState !== 'playing') return;
      
      const row = parseInt(e.target.dataset.row);
      const col = parseInt(e.target.dataset.col);
      revealCell(row, col);
    }

    function handleRightClick(e) {
      e.preventDefault();
      if (gameState !== 'playing') return;
      
      const row = parseInt(e.currentTarget.dataset.row);
      const col = parseInt(e.currentTarget.dataset.col);
      toggleFlag(row, col);
    }

    let touchTimer = null;
    function handleTouchStart(e) {
      if (gameState !== 'playing') return;
      
      const row = parseInt(e.currentTarget.dataset.row);
      const col = parseInt(e.currentTarget.dataset.col);
      
      touchTimer = setTimeout(() => {
        e.preventDefault();
        toggleFlag(row, col);
        touchTimer = null;
      }, 300);
    }

    function handleTouchEnd(e) {
      if (touchTimer) {
        clearTimeout(touchTimer);
        touchTimer = null;
        const row = parseInt(e.currentTarget.dataset.row);
        const col = parseInt(e.currentTarget.dataset.col);
        revealCell(row, col);
      }
    }

    function revealCell(row, col) {
      if (gameState !== 'playing') return;
      
      const data = grid[row][col];
      
      if (data.isRevealed && data.adjacentMines > 0) {
        autoReveal(row, col);
        if (currentMode === 'classic') {
          checkWin();
        }
        return;
      }
      
      if (data.isRevealed || data.isFlagged) return;
      
      if (firstClick) {
        firstClick = false;
        generateMines(row, col);
        if (currentMode === 'classic') {
          startTimer();
        }
      }
      
      if (data.isMine) {
        if (currentMode === 'classic') {
          data.isRevealed = true;
          data.hit = true;
          gameOver(false);
        } else {
          endScoreMode(false);
        }
        return;
      }
      
      floodReveal(row, col);
      if (currentMode === 'classic') {
        checkWin();
      } else {
        const totalCells = rows * cols;
        const safeCells = totalCells - totalMines;
        if (revealedCount === safeCells) {
          endScoreMode(true);
        }
      }
    }

    function floodReveal(row, col) {
      const queue = [[row, col]];
      const visited = new Set();
      visited.add(`${row},${col}`);
      
      let revealedThisTurn = 0;
      
      while (queue.length > 0) {
        const [r, c] = queue.shift();
        const data = grid[r][c];
        
        if (data.isRevealed || data.isFlagged) continue;
        
        data.isRevealed = true;
        revealedCount++;
        revealedThisTurn++;
        
        if (data.adjacentMines === 0) {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const nr = r + dr;
              const nc = c + dc;
              const key = `${nr},${nc}`;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !visited.has(key)) {
                visited.add(key);
                if (!grid[nr][nc].isFlagged) {
                  queue.push([nr, nc]);
                }
              }
            }
          }
        }
      }
      
      if (currentMode === 'score' && revealedThisTurn > 0) {
        updateCombo();
        const baseScore = revealedThisTurn * 10;
        const earnedScore = calculateScore(baseScore);
        score += earnedScore;
        scoreEl.textContent = score;
        
        const totalCells = rows * cols;
        const safeCells = totalCells - totalMines;
        if (revealedCount === safeCells) {
          endScoreMode(true);
          return;
        }
      }
      
      renderAllCells();
    }

    function toggleFlag(row, col) {
      if (gameState !== 'playing') return;
      
      const data = grid[row][col];
      if (data.isRevealed) return;
      
      data.isFlagged = !data.isFlagged;
      flagCount += data.isFlagged ? 1 : -1;
      
      updateCellDisplay(getCellElement(row, col), row, col);
      updateMinesDisplay();
      
      if (autoRevealOnFlag) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = row + dr;
            const nc = col + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
              const neighbor = grid[nr][nc];
              if (neighbor.isRevealed && neighbor.adjacentMines > 0) {
                autoReveal(nr, nc);
              }
            }
          }
        }
      }
    }

    function autoReveal(row, col) {
      const data = grid[row][col];
      if (!data.isRevealed || data.adjacentMines === 0) return;
      
      let adjacentFlags = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = row + dr;
          const nc = col + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
            if (grid[nr][nc].isFlagged) {
              adjacentFlags++;
            }
          }
        }
      }
      
      if (adjacentFlags === data.adjacentMines) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = row + dr;
            const nc = col + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
              const neighbor = grid[nr][nc];
              if (!neighbor.isRevealed && !neighbor.isFlagged) {
                if (neighbor.isMine) {
                  if (currentMode === 'classic') {
                    neighbor.isRevealed = true;
                    neighbor.hit = true;
                    renderAllCells();
                    gameOver(false);
                    return;
                  } else {
                    endScoreMode(false);
                    return;
                  }
                } else {
                  floodReveal(nr, nc);
                }
              }
            }
          }
        }
      }
    }

    function updateMinesDisplay() {
      const remaining = totalMines - flagCount;
      minesCountEl.textContent = String(Math.abs(remaining)).padStart(3, '0');
    }

    function renderAllCells() {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          updateCellDisplay(getCellElement(r, c), r, c);
        }
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timer++;
        timerEl.textContent = String(timer).padStart(3, '0');
        if (timer >= 999) {
          clearInterval(timerInterval);
        }
      }, 1000);
    }

    function checkWin() {
      const totalCells = rows * cols;
      const safeCells = totalCells - totalMines;
      
      if (revealedCount === safeCells) {
        gameOver(true);
      }
    }

    function checkWinByFlags() {
      let correctFlags = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].isFlagged && grid[r][c].isMine) {
            correctFlags++;
          }
        }
      }
      return correctFlags === totalMines;
    }

    function gameOver(won) {
      gameState = 'over';
      clearInterval(timerInterval);
      
      if (won) {
        faceBtn.textContent = FACES.win;
        gridEl.classList.add('win');
        setTimeout(() => gridEl.classList.remove('win'), 500);
        
        if (checkNewRecord(currentLevel, timer)) {
          setTimeout(() => showNewRecordModal(timer), 500);
        }
      } else {
        faceBtn.textContent = FACES.lose;
        
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (grid[r][c].isMine && !grid[r][c].isRevealed) {
              grid[r][c].isRevealed = true;
            }
          }
        }
        renderAllCells();
      }
      
      document.querySelectorAll('.cell').forEach(cell => {
        cell.classList.add('game-over');
      });
    }

    faceBtn.addEventListener('click', () => {
      if (currentMode === 'classic') {
        initGame(currentLevel);
      }
    });

    diffBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        diffBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const level = btn.dataset.level;
        currentLevel = level;
        initGame(level);
      });
    });

    leaderboardTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        leaderboardTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderLeaderboard(tab.dataset.tab);
      });
    });

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        switchMode(btn.dataset.mode);
      });
    });

    settingsToggle.addEventListener('click', () => {
      settingsToggle.classList.toggle('active');
      settingsPanel.classList.toggle('show');
    });

    submitBtn.addEventListener('click', () => {
      const name = playerNameInput.value.trim() || '匿名';
      if (currentMode === 'classic') {
        addRecord(currentLevel, name, timer);
      } else {
        addRecord(currentLevel, name, score);
      }
      hideNewRecordModal();
    });

    cancelBtn.addEventListener('click', hideNewRecordModal);

    modalOverlay.addEventListener('click', hideNewRecordModal);

    playerNameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        submitBtn.click();
      }
    });

    autoRevealToggle.addEventListener('click', () => {
      autoRevealOnFlag = !autoRevealOnFlag;
      updateAutoRevealToggle();
      saveSettings();
    });

    loadSettings();
    initLeaderboards();
    initGame();
  </script>
</body>
</html>
